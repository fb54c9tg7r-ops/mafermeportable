<meta name="theme-color" content="#1f4d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MaFerme">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<title>MaFermePortable</title>
<style>
:root{color-scheme:light;--bg:#f6f2e8;--card:#fffdf8;--forest:#1f4d2e;--forest2:#2f6b3f;--sage:#a8bfa0;--sagel:#e6eee1;--cream:#efe8d6;--tx:#1d2b20;--mut:#6b7868;--line:#e2dbc8;--blue:#2f5d3a;--soft:#e6eee1;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:600px;margin:0 auto;padding:0 16px 104px}
header.top{background:linear-gradient(160deg,var(--ac1,#1f4d2e),var(--ac,#2f6b3f));color:#fff;margin:0 -16px 20px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 20px;border-radius:0 0 26px 26px;box-shadow:0 8px 20px rgba(31,77,46,.22)}
.trow{display:flex;align-items:center;gap:12px}.trow>div{flex:1;min-width:0}
h1{font-size:23px;margin:0;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
header small{opacity:.8;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600;display:block}
.fn{margin-top:10px;font-size:15px;opacity:.92}
.back,.gear{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;text-decoration:none;flex:none}
.back:active,.gear:active{background:rgba(255,255,255,.3)}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--mut);margin:22px 4px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:14px;min-height:118px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;color:var(--tx);text-decoration:none;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(40,50,30,.06);transition:transform .12s}
.tile:active{transform:scale(.97)}
.ti{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:var(--sagel);color:var(--forest);font-size:22px}
.grid .tile:last-child:nth-child(odd){grid-column:span 2;min-height:84px;flex-direction:row;align-items:center;justify-content:flex-start}
.menu .tile{flex-direction:row;align-items:center;justify-content:flex-start;min-height:0;margin-bottom:12px;padding:14px 16px}
.bd{position:absolute;top:12px;right:12px;background:var(--forest);color:#fff;font-style:normal;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.bd.red{background:#c0392b}.bd.grn{background:var(--forest2)}
.menu .bd,.grid .tile:last-child:nth-child(odd) .bd{top:50%;right:14px;transform:translateY(-50%);font-size:13px}
form,.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(40,50,30,.05)}
form h2,.box h2{font-size:17px;margin:0 0 6px;color:var(--ac,var(--forest))}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--tx);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--forest2);box-shadow:0 0 0 3px rgba(47,107,63,.15)}
input[type=date]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;height:48px}
button.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;background:var(--ac,var(--forest));color:#fff;font-size:16px;font-weight:700;letter-spacing:.2px;box-shadow:0 4px 10px rgba(31,77,46,.25)}
button:active{transform:scale(.97)}
.card{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(40,50,30,.05)}
.card small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.x{background:none;border:0;color:var(--mut);font-size:18px;padding:8px}
.tag{display:inline-block;margin-top:6px;background:#fdecea;color:#b3261e;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
.pill{background:var(--sagel);color:var(--forest);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
.cnt{display:flex;align-items:center;gap:8px}
.cnt button{width:38px;height:38px;border-radius:50%;border:0;background:var(--ac,var(--forest));color:#fff;font-size:20px;font-weight:700;padding:0}
.cnt button.x{background:none;color:var(--mut);width:auto;height:auto;font-size:18px;padding:8px}
.cnt b{min-width:28px;text-align:center;font-size:20px}
.cnt input{width:76px;padding:9px;text-align:center}.cnt select{width:auto;padding:9px}
.gauge{height:14px;background:var(--cream);border-radius:8px;overflow:hidden}.gauge div{height:100%;background:var(--ac,var(--forest2));border-radius:8px;transition:width .3s}
.lvl{font-size:32px;font-weight:800;margin:6px 0 10px;color:var(--ac,var(--forest))}
.empty{color:var(--mut);text-align:center;padding:18px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{flex:1 1 30%;text-align:center;padding:12px 4px;border-radius:12px;color:#fff!important;font-weight:700;font-size:13px;border:3px solid transparent;margin:0!important;opacity:.5;text-transform:none!important;letter-spacing:0!important}.chip input{display:none}.chip:has(input:checked){border-color:var(--tx);opacity:1}
.gh{color:#fff;font-weight:700;padding:10px 14px;border-radius:14px 14px 0 0;margin-top:14px}.gb{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:4px 14px}
.al{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}.al:last-child{border:0}
.nbrow{display:flex;justify-content:space-between;align-items:center;border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:17px;box-shadow:0 2px 6px rgba(40,50,30,.12)}
.nbrow .cnt button{background:rgba(0,0,0,.3)}
.sync{color:var(--mut);font-size:12px;text-align:center;margin:20px 0 4px}
.alc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;margin-bottom:10px;border:1px solid;text-decoration:none;color:var(--tx)}
.alc .ai{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.alc b{display:block;font-size:15px}.alc .s{font-size:13px;color:var(--mut)}
.alc.red{background:#fdf1ef;border-color:#f0c9c4}.alc.red .ai{background:#f6d5d1;color:#b3261e}
.alc.amb{background:#fff6e5;border-color:#f1d9a6}.alc.amb .ai{background:#f8e5b9;color:#a8650b}
.alc.ok{background:var(--sagel);border-color:#cfdcc8}.alc.ok .ai{background:#d4e2cd;color:var(--forest)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.stats b{display:block;font-size:21px;color:var(--forest);text-transform:none;letter-spacing:0}
.pa{display:flex;align-items:center;gap:8px}
.ok{width:50px;height:50px;border-radius:50%;border:2px solid var(--forest2);background:var(--sagel);font-size:24px;padding:0}
.mv{border:0;background:var(--sagel);color:var(--forest);border-radius:12px;padding:9px 10px;font-size:13px;font-weight:700}
.pc b{font-size:17px}
.tod{color:#e65100!important;font-weight:700}.tom{color:#b26a00!important;font-weight:700}.late{color:#b3261e!important;font-weight:700}
textarea{resize:vertical;min-height:120px}
.stats div:nth-child(1) b{color:#c8683c}.stats div:nth-child(2) b{color:#3b8fb0}.stats div:nth-child(3) b{color:#5aa13f}.stats div:nth-child(4) b{color:#e09a2a}
.stats div{background:linear-gradient(160deg,#fffdf8,#f3efe2)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.swl{width:40px;height:40px;border-radius:50%;margin:0!important;border:3px solid transparent;display:block}.swl input{display:none}.swl:has(input:checked){border-color:var(--tx);box-shadow:inset 0 0 0 3px #fff}
.rowck{display:flex;align-items:center;gap:12px;font-size:17px!important;text-transform:none!important;letter-spacing:0!important;color:var(--tx)!important;margin:12px 0 0!important}.rowck input{width:26px;height:26px;flex:none}
.recap{background:linear-gradient(135deg,#fffdf8,#e6eee1);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(40,50,30,.06)}.rn{font-size:23px;font-weight:800;color:var(--forest);line-height:1.2}.rs{color:var(--mut);font-size:14px;margin-top:6px}.stats.s3{grid-template-columns:repeat(3,1fr);margin-bottom:18px}
.sch{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.sc{flex:none;padding:10px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:14px}.sc small{display:block;font-weight:600;color:var(--mut);font-size:11px}.sc.on{border-color:var(--ac,var(--forest));background:var(--sagel)}
.tpc{flex:none;padding:9px 14px;border-radius:20px;color:#fff;font-weight:700;font-size:13px;opacity:.4}.tpc.on{opacity:1;outline:3px solid var(--tx);outline-offset:1px}
.cnh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:17px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cw{text-align:center;font-size:11px;color:var(--mut);font-weight:700;padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600}.cd.td{border:2px solid var(--tx)}.cd.e{color:#fff;border-color:transparent}.cd.off{visibility:hidden}
.cdots{display:flex;gap:2px;height:7px;margin-top:2px}.dt{width:6px;height:6px;border-radius:50%;display:block}

.bn{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(255,253,248,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:50}
.bn:empty{display:none}.bn a{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);text-decoration:none;padding:5px 0;border-radius:12px}.bn a.on{color:var(--ac,var(--forest));background:var(--sagel)}
.emb{width:52px;height:52px;border-radius:14px;object-fit:cover;background:#eaebe5;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.wk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.wk:last-child{border:0}
.wi{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.wt{flex:1;min-width:0}.wt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wt span{font-size:13px;color:var(--mut)}
.wd{text-align:right;font-size:12px;color:var(--mut)}.wd b{display:block;font-size:15px;color:var(--tx)}
.lgd{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app.fx>*{animation:up .32s ease both}
#app.fx>*:nth-child(2){animation-delay:.04s}#app.fx>*:nth-child(3){animation-delay:.08s}#app.fx>*:nth-child(4){animation-delay:.12s}#app.fx>*:nth-child(5){animation-delay:.16s}#app.fx>*:nth-child(6){animation-delay:.2s}#app.fx>*:nth-child(n+7){animation-delay:.24s}
@keyframes sp{0%,62%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
#splash{position:fixed;inset:0;z-index:200;background:#eaebe5;display:flex;align-items:center;justify-content:center;animation:sp 2.4s ease forwards;pointer-events:none}
#splash img{width:min(80vw,400px);animation:pop .7s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash{display:none}}
.dch{display:inline-flex;width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;background:var(--cream);font-weight:700;font-size:14px;margin:0!important;text-transform:none!important;letter-spacing:0!important;color:var(--tx)!important}.dch input{display:none}.dch:has(input:checked){background:var(--ac,var(--forest));color:#fff!important}
.dtc{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}.al{flex-wrap:wrap}
html.mA{--forest:#8f2d26;--forest2:#b5443a;--sage:#d9a49c;--sagel:#f7e6e2;--cream:#f3e3de;--line:#ead8d2;--bg:#fbf4f1;--mut:#7a6a66;--tx:#2a1d1b;--blue:#8f2d26;--soft:#f7e6e2}
</style>
</head>

<nav id="nav" class="bn"></nav>

h+='<div class="box"><h2>Total lait</h2><div class="lvl">'+(Math.round(t*10)/10)+' L</div></div>';
h+=a.length?a.map(function(x){return '<div class="card"><b>Veau n° '+x.n+'</b><div class="cnt"><button data-c="stepVeau('+x.id+',-0.5)">−</button><input type="number" step="0.5" min="0" value="'+x.l+'" data-ch="setVeau('+x.id+',this.value)"><button data-c="stepVeau('+x.id+',0.5)">+</button><button class="x" data-c="delVeau('+x.id+')">✕</button></div></div>'}).join(''):'<div class="empty">Aucun veau enregistré</div>';
return h}
function vF(id){return D.veau.filter(function(x){return x.id==id})[0]}
function addVeau(e){e.preventDefault();var f=e.target,n=Math.min(100,Math.max(1,parseInt(f.n.value)||1)),l=Math.max(0,parseFloat(f.l.value)||0),x=D.veau.filter(function(r){return r.n==n})[0];if(x)x.l=l;else D.veau.push({id:Date.now(),n:n,l:l});save();go()}
function setVeau(id,v){var x=vF(id);if(!x)return;x.l=Math.max(0,parseFloat(v)||0);save();go()}
function stepVeau(id,d){var x=vF(id);if(!x)return;x.l=Math.max(0,Math.round((x.l+d)*10)/10);save();go()}
function delVeau(id){D.veau=D.veau.filter(function(x){return x.id!=id});save();go()}
function menuItems(k){return k=='cheptel'&&MODE=='A'?MENUS.cheptelA:MENUS[k]}
function setMode(m){MODE=m;try{localStorage.setItem('mfpMode_'+FID,m)}catch(e){}location.hash='home';go()}
function paramScreen(){var h=head('Paramètres','home');
h+='<h2 class="sec" style="margin-top:0">Version de l’application</h2><div class="menu">'+[['L','MfP Vache laitière','Lait, tarissement, veaux au lait'],['A','MfP Vache allaitante','Vêlages, sevrage, ventes de broutards']].map(function(m){var on=MODE==m[0];return '<div class="tile" style="cursor:pointer'+(on?';border:2px solid var(--forest2);background:var(--sagel)':'')+'" data-c="setMode(\''+m[0]+'\')"><span class="ti">'+ic('cheptel',24)+'</span><span>'+m[1]+'<small style="display:block;font-weight:500;color:var(--mut);font-size:12px">'+m[2]+'</small></span>'+(on?'<i class="bd grn">Active</i>':'')+'</div>'}).join('')+'</div><h2 class="sec">Réglages</h2><div class="menu">'+MENUS.parametres.map(function(m){return tile(m[0],m[1],m[2])}).join('')+'</div>';return h}
function menu(k,t,up){return head(t,up||'home')+'<div class="menu">'+menuItems(k).map(function(m){return tile(m[0],m[1],m[2])}).join('')+'</div>'}

function effCard(e){var tas=e.mode=='Tas';return '<div class="card" style="flex-wrap:wrap'+(e.spread?';opacity:.7':'')+'"><div><b>'+(e.typ=='Fumier'?'🟤 ':'💧 ')+esc(e.typ)+' · '+(tas?'Tas':'Épandage')+'</b> · '+esc(e.champ)+'<small>'+fmt(e.date)+(e.spread?' · épandu'+(e.sd?' le '+fmt(e.sd):''):'')+'</small></div><div class="cnt"><button data-c="cnt('+e.id+',-1)">−</button><b>'+e.n+'</b><button data-c="cnt('+e.id+',1)">+</button><button class="x" style="background:none;color:#6b7868;font-size:18px" data-c="delEff('+e.id+')">✕</button></div>'+(tas?'<label style="display:flex;align-items:center;gap:8px;width:100%;margin:6px 0 0;font-size:15px;color:#000"><input type="checkbox" style="width:22px;height:22px" '+(e.spread?'checked ':'')+'data-ch="setSpread('+e.id+',this.checked)"> Épandu ✅</label>':'')+'</div>'}
function tasSum(){var a=D.eff.filter(function(e){return e.mode=='Tas'&&!e.spread}),l={};a.forEach(function(e){l[e.champ]=1});var m=Object.keys(l).length;return m?m+(m>1?' emplacements à épandre':' emplacement à épandre'):'Aucun tas à épandre'}
function tasCard(e){return '<div class="card" style="flex-wrap:wrap;border-left:8px solid '+(e.spread?'#8a8a7a':'#3b8fb0')+(e.spread?';opacity:.65':'')+'"><div><b style="font-size:18px">'+esc(e.champ)+'</b><small>'+e.n+(e.n>1?' tas':' tas')+' · '+fmt(e.date)+(e.spread?' · épandu'+(e.sd?' le '+fmt(e.sd):''):' · à épandre')+'</small></div><div class="cnt"><button data-c="cnt('+e.id+',-1)">−</button><b>'+e.n+'</b><button data-c="cnt('+e.id+',1)">+</button><button class="x" data-c="delEff('+e.id+')">✕</button></div><label class="rowck" style="width:100%"><input type="checkbox" '+(e.spread?'checked ':'')+'data-ch="setSpread('+e.id+',this.checked)"> Épandu</label></div>'}
function tasScreen(){var a=D.eff.filter(function(e){return e.mode=='Tas'}).sort(function(x,y){return (x.spread?1:0)-(y.spread?1:0)||y.date.localeCompare(x.date)}),l={};a.forEach(function(e){if(!e.spread)l[e.champ]=1});var m=Object.keys(l).length,h=head('Tas de fumier','effluents');
h+='<div class="box" style="text-align:center"><div class="lvl" style="font-size:46px;margin:0">'+m+'</div><div style="color:var(--mut)">'+(m>1?'emplacements à épandre':'emplacement à épandre')+'</div></div>';
h+='<form data-s="addTas(event)"><h2>Ajouter un emplacement</h2><label>Emplacement (champ / parcelle)</label><input name="champ" list="pl" required><datalist id="pl">'+D.parc.map(function(x){return '<option value="'+esc(x.nom)+'">'}).join('')+'</datalist>'+dateField()+'<button type="button" class="go" data-c="sub">Ajouter</button></form>';
return h+(a.length?a.map(tasCard).join(''):'<div class="empty">Aucun tas enregistré</div>')}
function addTas(e){e.preventDefault();var f=e.target;D.eff.unshift({id:Date.now(),typ:'Fumier',mode:'Tas',champ:f.champ.value.trim(),date:f.date.value||today(),n:1,spread:false});save();go()}
function effluents(){
var h=head('💧 Effluents','home');
h+='<form data-s="addEff(event)"><h2>Nouvel enregistrement</h2><label>Type</label><select name="typ" data-ch="modeToggle(this.value)"><option>Fumier</option><option>Lisier</option></select><div id="modew"><label>Fumier : épandage ou tas ?</label><select name="mode"><option>Épandage</option><option>Tas</option></select></div><label>Champ / parcelle</label><input name="champ" placeholder="Nom du champ ou de la parcelle" required>'+dateField()+'<button type="button" class="go" data-c="sub">Ajouter</button></form>';
var ot=D.eff.filter(function(e){return e.mode!='Tas'});srt(ot);
h+='<a class="card" href="#tas" style="text-decoration:none;color:inherit;border-left:8px solid #3b8fb0"><div><b>Tas de fumier</b><small>'+tasSum()+'</small></div><span class="pill">Voir ›</span></a>';
h+=ot.length?ot.map(effCard).join(''):'<div class="empty">Aucun épandage enregistré</div>';
return h}
function addEff(e){e.preventDefault();var f=e.target,fum=f.typ.value=='Fumier';D.eff.unshift({id:Date.now(),typ:f.typ.value,mode:fum?f.mode.value:'Épandage',champ:f.champ.value.trim(),date:f.date.value||today(),n:1,spread:false});save();go()}
function setSpread(id,v){var e=D.eff.filter(function(x){return x.id==id})[0];e.spread=v;e.sd=v?today():'';save();go()}
function cnt(id,d){var e=D.eff.filter(function(x){return x.id==id})[0];e.n=Math.max(0,e.n+d);save();go()}
function delEff(id){D.eff=D.eff.filter(function(x){return x.id!=id});save();go()}

function logScreen(k){
var c=L[k],h=head(c.t,c.up);
h+='<form data-s="addLog(event,\''+k+'\')"><h2>Nouvelle entrée</h2>'+dateField();
c.f.forEach(function(f){h+='<label>'+f[1]+'</label>';
if(f[2]=='date')h+='<input type="date" name="'+f[0]+'">';else if(f[2].indexOf('select:')==0)h+='<select name="'+f[0]+'">'+f[2].slice(7).split(',').map(function(o){return '<option>'+o+'</option>'}).join('')+'</select>';
else h+='<input name="'+f[0]+'"'+(c.f[0]===f?' required':'')+'>'});
h+='<button type="button" class="go" data-c="sub">Ajouter</button></form>';
var a=D.log[k]||[];srt(a);
h+=a.length?a.map(function(e){var ds=c.f.slice(1).map(function(f){return e.v[f[0]]?(c.lab&&c.lab[f[0]]||'')+(f[2]=='date'?fmt(e.v[f[0]]):e.v[f[0]]):''}).filter(Boolean);return '<div class="card"><div><b>'+esc((c.ti||'')+(e.v[c.f[0][0]]||'—'))+'</b><small>'+fmt(e.date)+(ds.length?' · '+esc(ds.join(' · ')):'')+'</small>'+((k=='tarissement'||k=='saillie')&&vAl(e)!==null?'<span class="tag">Vêlage '+vLab(vAl(e))+'</span>':'')+'</div><button class="x" data-c="delLog(\''+k+'\','+e.id+')">✕</button></div>'}).join(''):'<div class="empty">Aucune entrée</div>';
return h}
function addLog(e,k){e.preventDefault();var f=e.target,o={id:Date.now(),date:f.date.value||today(),v:{}};L[k].f.forEach(function(x){o.v[x[0]]=f[x[0]].value.trim()});(D.log[k]=D.log[k]||[]).unshift(o);save();go()}
function delLog(k,id){D.log[k]=D.log[k].filter(function(x){return x.id!=id});save();go()}

function level(){return D.gnr.ev.reduce(function(s,e){return s+(e.t=='cuve'?e.l:-e.l)},0)}
function gnr(){
var lv=Math.max(0,level()),cap=D.gnr.cap||1,p=Math.min(100,Math.round(lv/cap*100));
var h=head('GNR','carburant');
h+='<div class="box"><h2>Niveau de la cuve</h2><div class="lvl">'+Math.round(lv)+' L <small style="font-size:15px;font-weight:400;color:#6b7868">/ '+cap+' L ('+p+' %)</small></div><div style="display:flex;justify-content:center;margin:6px 0 4px">'+ring(p)+'</div><label>Capacité de la cuve (L)</label><input type="number" min="1" value="'+cap+'" data-ch="setCap(this.value)"></div>';
h+=gnrChart();h+='<form data-s="addGnr(event,\'cuve\')"><h2>Remplissage de la cuve</h2>'+dateField()+'<label>Litres ajoutés</label><input type="number" name="l" min="1" step="any" required><button type="button" class="go" data-c="sub">Enregistrer</button></form>';
h+='<form data-s="addGnr(event,\'tr\')"><h2>Plein d’un tracteur</h2>'+dateField()+'<label>Tracteur</label><select name="tr">'+opts(D.veh)+'</select><label>Litres pris</label><input type="number" name="l" min="1" step="any" required><button type="button" class="go" data-c="sub">Enregistrer</button></form>';
var a=D.gnr.ev;srt(a);
h+=a.length?a.map(function(e){return '<div class="card"><div><b>'+(e.t=='cuve'?'⛽️ Remplissage cuve':(e.tr=='Voitures'?'🚗 ':'🚜 ')+esc(e.tr))+'</b><small>'+fmt(e.date)+'</small></div><div><b style="color:'+(e.t=='cuve'?'#2f5d3a':'#000')+'">'+(e.t=='cuve'?'+':'−')+e.l+' L</b><button class="x" data-c="delGnr('+e.id+')">✕</button></div></div>'}).join(''):'<div class="empty">Aucun mouvement</div>';
h+=vehBox();return h}
function setCap(v){D.gnr.cap=Math.max(1,parseFloat(v)||1);save();go()}
function addGnr(e,t){e.preventDefault();var f=e.target,o={id:Date.now(),t:t,date:f.date.value||today(),l:parseFloat(f.l.value)};if(t=='tr')o.tr=f.tr.value.trim();D.gnr.ev.unshift(o);save();go()}
function delGnr(id){D.gnr.ev=D.gnr.ev.filter(function(x){return x.id!=id});save();go()}

function go(){
var G=gateHtml();if(G!==null){try{document.getElementById('nav').innerHTML=''}catch(x){}var A0=document.getElementById('app');A0.className=anim?'fx':'';anim=false;A0.innerHTML=G;return}
if(!D.veh.length)D.veh=VEH0.slice();migLots();syncNb();
var v=location.hash.slice(1)||'home',h;
if(v=='effluents')h=effluents();else if(v=='gnr')h=gnr();else if(v=='cheptel')h=menu('cheptel','🐮 Cheptel');else if(v=='parcellaire')h=menu('parcellaire','🌾 Parcellaire');else if(v=='alimentation')h=alimScreen();else if(L[v])h=logScreen(v);else if(v=='reproduction')h=menu('reproduction','Reproduction','cheptel');else if(v=='nombre')h=nbScreen();else if(v=='carburant')h=menu('carburant','Carburant','home');else if(v=='adblue')h=adblueScreen();else if(v=='recurrentes')h=recScreen();else if(v=='fermes')h=fermesScreen();else if(v=='salaries')h=salScreen();else if(v.indexOf('invitation-')==0)h=joinScreen(v.slice(11));else if(v=='tas')h=tasScreen();else if(v=='ilots')h=ilotsScreen();else if(v=='parcelles')h=parcellesScreen();else if(v=='parcelle')h=parcelleScreen();else if(v=='veau')h=veauScreen();else if(v=='parametres')h=paramScreen();else if(v=='mafarme')h=farmScreen();else if(v=='contact')h=contactScreen();else if(v=='connexion')h=connexionScreen();else if(v=='planning')h=menu('planning','🗓️ Planning');else if(v=='urgent'||v=='prochainement')h=planScreen(v);else h=home();
try{var pl=pal(v),st=document.documentElement.style;st.setProperty('--ac1',pl[0]);st.setProperty('--ac',pl[1]);document.documentElement.className=MODE=='A'?'mA':'';var tm=document.querySelector('meta[name=theme-color]');if(tm)tm.setAttribute('content',MODE=='A'?'#7f241f':'#1f4d2e')}catch(x){}
try{document.getElementById('nav').innerHTML=navHtml(v)}catch(x){}
var AE=document.getElementById('app');AE.className=anim?'fx':'';anim=false;AE.innerHTML=h+'<p class="sync">'+syncMsg+' · version publique 1.0</p>'}
window.addEventListener('hashchange',function(){anim=true;armA=null;msgUrl='';invId=null;planOpen=false;go();window.scrollTo(0,0)});
window.addEventListener('error',function(e){var d=document.getElementById('dbg');if(!d){d=document.createElement('p');d.id='dbg';d.className='sync';d.style.color='#ffb4b4';document.body.appendChild(d)}d.textContent='Erreur : '+e.message});
try{document.getElementById('spl').src=LOGO}catch(e){}
try{if(sessionStorage.getItem('sp')){var spx=document.getElementById('splash');spx.parentNode.removeChild(spx)}else sessionStorage.setItem('sp','1')}catch(e){}
go();bootApp();
</script>
